name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  # gh pr checks --watch reads commit statuses (Vercel and other integrations) and
  # checkSuite.workflowRun. Without these two the merge step dies on
  # 'Resource not accessible by integration' — measured 2026-08-13, 12 open patch
  # PRs across the estate were stuck on exactly that.
  actions: read
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Wait for checks, then merge patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checks "${{ github.event.pull_request.html_url }}" --watch
          gh pr merge --squash "${{ github.event.pull_request.html_url }}"
